name: Check that docs build
on:
  pull_request:
    branches: [master]
    paths:
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/**'
      - '.github/workflows/docs_check.yml'
      - '.github/workflows/deploy_docs.yml'
      - '**.md'
      - 'ogcore/**.py'

jobs:
  build:
    if: github.repository == 'PSLmodels/OG-Core'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install package and dependencies
        run: uv sync --extra dev --extra docs

      - name: Check documentation build tooling
        run: uv run --extra dev --extra docs pytest docs/test_build_docs.py

      - name: Build # Build Jupyter Book
        env:
          BASE_URL: /OG-Core
        run: |
          uv run make documentation
